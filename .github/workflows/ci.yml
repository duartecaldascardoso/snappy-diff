name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same npm major as local development; see release.yml.
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI
        working-directory: ui
        run: |
          npm ci
          npx oxlint
          npm test
          # The build type-checks too, and the Rust tests embed its output.
          npm run build
      - name: Rust
        run: cargo test --locked
