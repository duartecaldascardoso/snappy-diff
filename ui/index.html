<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snappy diff</title>
    <script>
      // Paint the last used mode and theme colors before React loads.
      (function () {
        var root = document.documentElement
        var t = localStorage.getItem('theme')
        var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        try {
          var chrome = JSON.parse(localStorage.getItem('chrome') || 'null')
          if (chrome) {
            for (var k in chrome.vars) root.style.setProperty(k, chrome.vars[k])
            dark = chrome.dark
          }
        } catch (e) {}
        root.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
