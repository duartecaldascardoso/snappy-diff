[package]
name = "snappy-diff"
version = "0.1.0"
edition = "2021"
description = "An insanely fast side-by-side diff viewer for git branches and patch files"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "fs"] }
clap = { version = "4", features = ["derive"] }
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
